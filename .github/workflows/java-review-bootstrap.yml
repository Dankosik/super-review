# Temporary branch-only build; remove this workflow after collecting its result.
name: Java review branch build
on:
  push:
    branches: [feat/java-review-support]
permissions:
  contents: write
concurrency:
  group: java-review-support-bootstrap
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.1
      - run: python3 .java-review-apply.py
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test
      - run: bun run typecheck
      - run: bun run validate
      - run: bun run package
      - run: bun scripts/check-mcp.ts
      - name: Commit verified integration and native payloads on this branch only
        run: |
          git diff --check
          git rm -- .java-review-apply.py
          git add -- skills adapters src runtime scripts docs examples tests evals README.md CHANGELOG.md package.json plugin.json .codex-plugin .claude-plugin .agents
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(java): integrate routing and reader; regenerate verified native payloads'
          git push origin HEAD:refs/heads/feat/java-review-support
