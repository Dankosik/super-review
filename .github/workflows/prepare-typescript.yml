name: Prepare TypeScript review payload

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'Dankosik/super-review' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/typescript-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.1
      - name: Apply bounded source and policy edits
        run: python3 .github/prepare-typescript.py
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test
      - run: bun run typecheck
      - run: bun run validate
      - run: bun run package
      - name: Commit generated payload and remove this one-shot authoring aid
        run: |
          git rm .github/prepare-typescript.py .github/workflows/prepare-typescript.yml
          git add skills adapters src scripts runtime package.json plugin.json .codex-plugin README.md CHANGELOG.md docs evals tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: integrate TypeScript review and regenerate native payloads'
          git push origin HEAD:refs/heads/feat/typescript-review
