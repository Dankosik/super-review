name: Prepare Rust review branch

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/rust-review-support' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.1
      - name: Apply one-time source integration
        run: python3 .github/rust-review-prepare.py
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test
      - run: bun run typecheck
      - run: bun run validate
      - run: bun run package
      - run: bun scripts/check-mcp.ts
      - name: Commit tested source and native payloads to this feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m 'feat: integrate Rust review and regenerate native packages'
          gh auth setup-git
          git push origin HEAD:refs/heads/feat/rust-review-support
