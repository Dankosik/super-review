name: Validate and release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: super-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Check generated native payloads
        run: git diff --exit-code -- adapters/claude/plugin adapters/codex/super-review adapters/cursor/plugin adapters/antigravity/plugin
      - run: bun test
      - run: bun run typecheck
      - run: bun run validate
      - run: bun run package
      - run: bun audit
      - name: Validate native Claude package
        run: npx --yes --package @anthropic-ai/claude-code@2.1.280 claude plugin validate adapters/claude/plugin
      - name: Install pinned OpenCode 1 and 2 for native configuration checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for version in 1.18.29 2.2.3; do
            directory="$RUNNER_TEMP/super-review-opencode-$version"
            mkdir -p "$directory"
            gh release download "v$version" --repo anomalyco/opencode \
              --pattern opencode-linux-x64.tar.gz --dir "$directory"
            tar -xzf "$directory/opencode-linux-x64.tar.gz" -C "$directory"
          done
      - name: Verify native roles, permissions and project-role isolation
        run: |
          # Each version gets its own data and state: the two database schemas differ.
          for version in 1.18.29 2.2.3; do
            directory="$RUNNER_TEMP/super-review-opencode-$version"
            XDG_DATA_HOME="$directory/data" XDG_STATE_HOME="$directory/state" XDG_CACHE_HOME="$directory/cache" \
              bun scripts/check-opencode.ts "$directory/opencode"
          done
      - name: Validate native Antigravity package (CLI 1.5.9)
        run: |-
          directory="$RUNNER_TEMP/super-review-antigravity"
          mkdir -p "$directory"
          curl -fsSL https://storage.googleapis.com/antigravity-public/antigravity-cli/1.5.9-4515810895593472/linux-x64/cli_linux_x64.tar.gz -o "$directory/agy.tar.gz"
          printf '%s  %s\n' 'd01eb13ba7750eed18907f1ae8860864371e0ad9064415e8d033d22b4bd7b9b4e4c7f962058520b452d67db1c33163d9a889d55a7dffa159596ec6cd91a87b79' "$directory/agy.tar.gz" | sha512sum --check
          tar -xzf "$directory/agy.tar.gz" -C "$directory" antigravity
          "$directory/antigravity" --version
          "$directory/antigravity" plugin validate --strict adapters/antigravity/plugin
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.1
      - name: Check tag identity
        run: |
          test "$GITHUB_REF_NAME" = "v$(bun -p 'require("./package.json").version')"
      - run: bun run package
      - name: Publish the exact tagged build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/manifest.json dist/SHA256SUMS \
            --verify-tag --title "Super Review $GITHUB_REF_NAME" --notes-file CHANGELOG.md
