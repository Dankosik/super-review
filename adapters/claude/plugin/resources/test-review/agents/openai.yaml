interface:
  display_name: "Test Review"
  short_description: "Find promised Go, TypeScript, Rust, or Java behavior the tests would not notice breaking, shown by a mistake no test would catch and the check that would"
  default_prompt: "Use $test-review to check whether the tests in this Go, TypeScript, Rust, or Java PR or local source would fail if a plausible bug appeared."
policy:
  allow_implicit_invocation: false
