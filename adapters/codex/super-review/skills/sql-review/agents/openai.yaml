interface:
  display_name: "SQL Review"
  short_description: "Review PostgreSQL, MySQL, or SQLite schemas, migrations, queries, transactions, indexes, and DB boundaries by reading, verified by an independent challenge"
  default_prompt: "Use $sql-review to review SQL schemas, migrations, queries, transactions, indexes, and database boundaries in this PR or local source."
policy:
  allow_implicit_invocation: false
